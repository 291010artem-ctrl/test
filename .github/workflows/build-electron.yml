name: Build Windows app (.exe)

on:
  workflow_dispatch:
  push:
    branches: ["claude/remote-phone-control-panel-2tpseh"]
    paths:
      - "remote-control/**"
      - ".github/workflows/build-electron.yml"
      - "!remote-control/android-companion/**"

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: remote-control
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Build portable .exe
        run: npm run dist:portable

      - name: Upload portable exe
        uses: actions/upload-artifact@v4
        with:
          name: android-remote-panel-portable-exe
          path: remote-control/dist/AndroidRemotePanel-*-portable.exe
          if-no-files-found: error
