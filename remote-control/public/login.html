<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход — Remote Panel</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0f1216; color: #e6edf3; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .card { background: #171c22; border: 1px solid #2a333d; border-radius: 12px; padding: 36px 40px; width: 100%; max-width: 360px; }
    h1 { font-size: 22px; font-weight: 700; text-align: center; margin-bottom: 28px; letter-spacing: -.3px; }
    label { display: block; font-size: 12px; color: #8b98a5; margin-bottom: 5px; font-weight: 600; text-transform: uppercase; letter-spacing: .5px; }
    input { width: 100%; background: #0f1216; border: 1px solid #2a333d; border-radius: 7px; color: #e6edf3; padding: 10px 13px; font-size: 14px; margin-bottom: 16px; outline: none; transition: border-color .15s; }
    input:focus { border-color: #388bfd; }
    button { width: 100%; background: #388bfd; color: #fff; border: none; border-radius: 7px; padding: 11px; font-size: 14px; font-weight: 600; cursor: pointer; transition: background .15s; margin-top: 4px; }
    button:hover { background: #2f7de0; }
    .err { color: #f85149; font-size: 13px; text-align: center; margin-top: 14px; min-height: 18px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🔒 Remote Panel</h1>
    <form method="POST" action="/login">
      <label>Логин</label>
      <input type="text" name="user" autocomplete="username" autofocus>
      <label>Пароль</label>
      <input type="password" name="pass" autocomplete="current-password">
      <button type="submit">Войти</button>
    </form>
    <div class="err" id="errMsg"></div>
  </div>
  <script>
    const p = new URLSearchParams(location.search);
    if (p.get('err') === '1') document.getElementById('errMsg').textContent = 'Неверный логин или пароль';
    if (p.get('err') === '2') document.getElementById('errMsg').textContent = 'Слишком много попыток. Подождите 15 минут.';
  </script>
</body>
</html>
